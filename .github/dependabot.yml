version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - ci

  - package-ecosystem: pip
    directory: /
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # pytest-homeassistant-custom-component pins the compatible pytest release.
      - dependency-name: pytest
    labels:
      - dependencies
      - tests
