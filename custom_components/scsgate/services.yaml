send_raw_telegram:
  name: Send raw SCS telegram
  description: >-
    Send a raw SCS telegram. Enable raw commands in this SCSGATE entry's options
    and set confirm to true. Do not use for ordinary device control.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: scsgate
    type:
      required: true
      selector:
        text:
    from:
      required: true
      selector:
        text:
    to:
      required: true
      selector:
        text:
    cmd:
      required: true
      selector:
        text:
    response:
      default: none
      selector:
        select:
          options:
            - none
            - y
            - i
    confirm:
      required: true
      selector:
        boolean:

export_bus_log:
  name: Export bus activity log
  description: >-
    Return broker-wide volatile SCSGATE MQTT activity. Messages cannot be
    attributed to one gateway when gateways share a broker. The result may
    reveal device addresses, commands, and occupancy patterns. Requires the bus
    monitor option and explicit confirmation. Do not call from automations.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: scsgate
    limit:
      default: 100
      selector:
        number:
          min: 1
          max: 500
          mode: box
    confirm:
      required: true
      selector:
        boolean:

clear_bus_log:
  name: Clear bus activity log
  description: Clear the shared, broker-wide in-memory SCSGATE activity log.
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: scsgate
    confirm:
      required: true
      selector:
        boolean:
